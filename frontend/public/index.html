<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#16a34a" />
        <meta name="description" content="Сервис заказа поездок: разместите заказ и исполнитель приедет."/>
        <link rel="manifest" href="/api/manifest.json" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <!-- Preconnect for faster first paint & API call -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://cdn.onesignal.com" />
        <link rel="dns-prefetch" href="https://api-maps.yandex.ru" />
        <link rel="dns-prefetch" href="https://sms.ru" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet" />
        <title>Рядом — заказ поездки за минуту</title>
        <style>* { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }</style>
        <!-- OneSignal Web Push -->
        <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
        <script>
          window.OneSignalDeferred = window.OneSignalDeferred || [];
          window.OneSignalDeferred.push(async function (OneSignal) {
            try {
              const res = await fetch('/api/settings/public', { cache: 'no-store' });
              const s = await res.json();
              if (s && s.onesignal_app_id && /^[a-f0-9-]{36}$/i.test(s.onesignal_app_id)) {
                await OneSignal.init({
                  appId: s.onesignal_app_id,
                  allowLocalhostAsSecureOrigin: true,
                  serviceWorkerPath: '/OneSignalSDKWorker.js',
                  // Auto-prompt all visitors via slide-down message
                  promptOptions: {
                    slidedown: {
                      prompts: [
                        {
                          type: "push",
                          autoPrompt: true,
                          text: {
                            actionMessage: "Получайте уведомления о статусе заказов: водитель найден, едет к вам, поездка завершена.",
                            acceptButton: "Включить",
                            cancelButton: "Не сейчас"
                          },
                          delay: { pageViews: 1, timeDelay: 5 }
                        }
                      ]
                    }
                  }
                });
              }
            } catch (e) { /* ignore */ }
          });
        </script>
    </head>
    <body>
        <noscript>Для работы приложения включите JavaScript.</noscript>
        <div id="root"></div>
    </body>
</html>
