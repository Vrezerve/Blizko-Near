<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Такси-сервис Рядом" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet" />
        <title>Такси Рядом</title>
        <style>* { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }</style>
        <!-- OneSignal Web Push -->
        <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
        <script>
          window.OneSignalDeferred = window.OneSignalDeferred || [];
          window.OneSignalDeferred.push(async function (OneSignal) {
            try {
              const res = await fetch('/api/settings/public', { cache: 'no-store' });
              const s = await res.json();
              if (s && s.onesignal_app_id && /^[a-f0-9-]{36}$/i.test(s.onesignal_app_id)) {
                await OneSignal.init({
                  appId: s.onesignal_app_id,
                  allowLocalhostAsSecureOrigin: true,
                  serviceWorkerPath: '/OneSignalSDKWorker.js',
                });
              }
            } catch (e) { /* ignore */ }
          });
        </script>
    </head>
    <body>
        <noscript>Для работы приложения включите JavaScript.</noscript>
        <div id="root"></div>
    </body>
</html>
